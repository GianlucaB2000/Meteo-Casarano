name: Meteo Casarano

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Scarica repository
        uses: actions/checkout@v4

      - name: Configura Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Installa requests
        run: pip install requests

      - name: Leggi ThingSpeak
        run: python meteo.py
